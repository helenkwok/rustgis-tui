[package]
name = "rustgis-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal UI for RustGIS, and a Claude Code pane you and Claude drive together"
license = "MIT"
repository = "https://github.com/helenkwok/rustgis-tui"

[dependencies]
base64 = "=0.23.1"
image = "=0.25.10"
ratatui = "=0.30.2"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
serde_json = "=1.0.154"
